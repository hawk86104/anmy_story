<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1370" viewBox="0 0 390 1370"><title>记录编辑器交互状态</title><desc>MyLife 乌萨奇主题视觉提案。全部内容为示例。阶段 A。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="390" height="1370" fill="#FFF9ED"/><g data-ui="手机顶部 · 记录的几个小选择" data-x="0" data-y="0" data-w="390" data-h="87"><text x="22" y="17" font-size="12" font-weight="600" fill="#544235" text-anchor="start">9:41</text><path d="M320 14v-3m5 3V8m5 6V5" stroke="#544235" stroke-width="2.5"/><rect x="344" y="7" width="23" height="11" rx="3" fill="none" stroke="#544235" stroke-width="1.3"/><rect x="347" y="10" width="16" height="5" rx="1" fill="#544235" stroke="none" stroke-width="1"/><rect x="0" y="24" width="390" height="62" rx="0" fill="#FFF9ED" stroke="none" stroke-width="1"/><g transform="translate(20 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l-8 8 8 8"/></g><text x="55" y="61" font-size="18" font-weight="700" fill="#544235" text-anchor="start">记录的几个小选择</text><g transform="translate(347 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h.01M12 12h.01M20 12h.01"/></g><path d="M20 86L370 86" stroke="#E9DCC7" fill="none" stroke-dasharray=""/></g><text x="20" y="131" font-size="19" font-weight="700" fill="#544235" text-anchor="start">日期慢慢想，可见范围自己选。</text><rect x="20" y="163" width="350" height="350" rx="24" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><text x="42" y="207" font-size="20" font-weight="700" fill="#544235" text-anchor="start">这件事，发生在什么时候？</text><text x="42" y="241" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">补录旧事，也可以只填大概时间。</text><g data-ui="标签 · 具体日期" data-x="42" data-y="275" data-w="72" data-h="28"><rect x="42" y="275" width="72" height="28" rx="14" fill="#F6CE55" stroke="none" stroke-width="1"/><text x="54" y="292" font-size="12" font-weight="500" fill="#544235" text-anchor="start">具体日期</text></g><g data-ui="标签 · 只记得月份" data-x="158" data-y="275" data-w="84" data-h="28"><rect x="158" y="275" width="84" height="28" rx="14" fill="#FFFEFA" stroke="none" stroke-width="1"/><text x="170" y="292" font-size="12" font-weight="500" fill="#544235" text-anchor="start">只记得月份</text></g><g data-ui="标签 · 只记得年份" data-x="42" data-y="318" data-w="84" data-h="28"><rect x="42" y="318" width="84" height="28" rx="14" fill="#FFFEFA" stroke="none" stroke-width="1"/><text x="54" y="335" font-size="12" font-weight="500" fill="#544235" text-anchor="start">只记得年份</text></g><g data-ui="标签 · 不太确定" data-x="176" data-y="318" data-w="72" data-h="28"><rect x="176" y="318" width="72" height="28" rx="14" fill="#FFFEFA" stroke="none" stroke-width="1"/><text x="188" y="335" font-size="12" font-weight="500" fill="#544235" text-anchor="start">不太确定</text></g><rect x="42" y="371" width="306" height="52" rx="14" fill="#FFF9ED" stroke="#E9DCC7" stroke-width="1"/><text x="59" y="402" font-size="17" font-weight="600" fill="#544235" text-anchor="start">2026 年 10 月 24 日</text><g data-ui="按钮 · 就用这个日期" data-x="42" data-y="447" data-w="306" data-h="44"><rect x="42" y="447" width="306" height="44" rx="16" fill="#F6CE55" stroke="#E8BB3C" stroke-width="1"/><text x="60" y="475.5" font-size="16" font-weight="600" fill="#544235" text-anchor="start">就用这个日期</text><g transform="translate(313 459.5) scale(0.7916666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L21 5"/></g></g><rect x="20" y="541" width="350" height="322" rx="24" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><text x="42" y="582" font-size="20" font-weight="700" fill="#544235" text-anchor="start">谁可以看到这段记忆？</text><g data-ui="列表项 · 仅自己和家长" data-x="39" data-y="611" data-w="312" data-h="82"><rect x="39" y="611" width="312" height="82" rx="18" fill="#DEE8D4" stroke="#E9DCC7" stroke-width="1"/><rect x="53" y="628" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(66 641) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6a6 6 0 0 1 12 0v4M4 10h16v12H4zM12 15v3"/></g><text x="115" y="642" font-size="16" font-weight="600" fill="#544235" text-anchor="start">仅自己和家长</text><text x="115" y="666" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">把这一页，留在家庭空间里</text><text x="334" y="649" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">已选</text></g><g data-ui="列表项 · 所有人可见" data-x="39" data-y="709" data-w="312" data-h="82"><rect x="39" y="709" width="312" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="53" y="726" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(66 739) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0M2 12h20M12 2c6 6 6 14 0 20-6-6-6-14 0-20"/></g><text x="115" y="740" font-size="16" font-weight="600" fill="#544235" text-anchor="start">所有人可见</text><text x="115" y="764" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">包括没有登录的游客</text><text x="334" y="747" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">选择</text></g><text x="42" y="828" font-size="11" font-weight="400" fill="#7B6B5A" text-anchor="start">选择后保存即可生效，也可以随时撤回。</text><rect x="20" y="891" width="350" height="351" rx="24" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><g transform="translate(167 915) scale(1.8333333333333333)" fill="none" stroke="#9B665F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4a4 4 0 0 1 8 0v8a4 4 0 0 1-8 0zM4 10v2a8 8 0 0 0 16 0v-2M12 20v4M8 24h8"/></g><text x="195" y="1016" font-size="33" font-weight="700" fill