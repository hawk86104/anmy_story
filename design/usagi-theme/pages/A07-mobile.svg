<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1330" viewBox="0 0 390 1330"><title>AI与长期保存设置</title><desc>MyLife 乌萨奇主题视觉提案。全部内容为示例。阶段 C。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="390" height="1330" fill="#FFF9ED"/><g data-ui="手机顶部 · AI 与长期保存" data-x="0" data-y="0" data-w="390" data-h="87"><text x="22" y="17" font-size="12" font-weight="600" fill="#544235" text-anchor="start">9:41</text><path d="M320 14v-3m5 3V8m5 6V5" stroke="#544235" stroke-width="2.5"/><rect x="344" y="7" width="23" height="11" rx="3" fill="none" stroke="#544235" stroke-width="1.3"/><rect x="347" y="10" width="16" height="5" rx="1" fill="#544235" stroke="none" stroke-width="1"/><rect x="0" y="24" width="390" height="62" rx="0" fill="#FFF9ED" stroke="none" stroke-width="1"/><g transform="translate(20 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l-8 8 8 8"/></g><text x="55" y="61" font-size="18" font-weight="700" fill="#544235" text-anchor="start">AI 与长期保存</text><g transform="translate(347 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h.01M12 12h.01M20 12h.01"/></g><path d="M20 86L370 86" stroke="#E9DCC7" fill="none" stroke-dasharray=""/></g><text x="20" y="139" font-size="26" font-weight="700" fill="#544235" text-anchor="start">整理之前，先保留真实。</text><text x="20" y="171" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">由家长决定何时开启，内容仍由自己确认。</text><rect x="20" y="208" width="350" height="212" rx="24" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><g transform="translate(42 232) scale(1.0416666666666667)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="83" y="251" font-size="21" font-weight="700" fill="#544235" text-anchor="start">AI 整理</text><g data-ui="标签 · 关闭" data-x="285" data-y="229" data-w="63" data-h="28"><rect x="285" y="229" width="63" height="28" rx="14" fill="#FFFEFA" stroke="none" stroke-width="1"/><text x="297" y="246" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="start">关闭</text></g><text x="42" y="299" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">可辅助语音转写、标题建议和原意整理。</text><text x="42" y="323.7" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">默认关闭，开启前需要家长配置服务</text><text x="42" y="348.4" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">并了解数据会发送到哪里。</text><text x="42" y="392" font-size="13" font-weight="600" fill="#7B6B5A" text-anchor="start">配置服务与授权 →</text><rect x="20" y="448" width="350" height="192" rx="24" fill="#FFF0BF" stroke="none" stroke-width="1"/><text x="42" y="489" font-size="19" font-weight="700" fill="#544235" text-anchor="start">每次采纳，都保留原来的你。</text><text x="42" y="528" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">整理结果与原文并排展示。</text><text x="42" y="553.35" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">由孩子或家长确认后，才保存为新版本。</text><text x="42" y="578.7" font-size="13" font-weight="400" fill="#7B6B5A" text-anchor="start">最初的表达与录音会持续保留。</text><text x="20" y="702" font-size="22" font-weight="700" fill="#544235" text-anchor="start">把成长，稳稳带走</text><g data-ui="列表项 · 导出完整成长档案" data-x="20" data-y="728" data-w="350" data-h="82"><rect x="20" y="728" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="745" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 758) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v14M6 10l6 6 6-6M3 16v6h18v-6"/></g><text x="96" y="759" font-size="16" font-weight="600" fill="#544235" text-anchor="start">导出完整成长档案</text><text x="96" y="783" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">记录、素材、项目与版本的 ZIP 包</text><text x="353" y="766" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">设置</text></g><g data-ui="列表项 · JSON / Markdown" data-x="20" data-y="826" data-w="350" data-h="82"><rect x="20" y="826" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="843" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 856) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 13h8M8 17h6"/></g><text x="96" y="857" font-size="16" font-weight="600" fill="#544235" text-anchor="start">JSON / Markdown</text><text x="96" y="881" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">适合长期保存与迁移</text><text x="353" y="864" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">查看</text></g><g data-ui="列表项 · 备份与恢复" data-x="20" data-y="924" data-w="350" data-h="82"><rect x="20" y="924" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="941" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 954) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6a6 6 0 0 1 12 0v4M4 10h16v12H4zM12 15v3"/></g><text x="96" y="955" font-size="16" font-weight="600" fill="#544235" text-anchor="start">备份与恢复</text><text x="96" y="979" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">查看最近备份与恢复说明</text><text x="353" y="962" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">管理</text></g><rect x="20" y="1038" width="350" height="126" rx="23" fill="#DEE8D4" stroke="none" stroke-width="1"/><text x="42" y="1074" font-size="13" font-weight="400" fill="#52664F" text-anchor="start">重要的素材，可以选择保留原件。</text><text x="42" y="1098.7" font-size="13" font-weight="400" fill="#52664F" text-anchor="start">长期保存设置与普通上传优化分别管理。</text><g data-ui="手机底部导航 · cms" data-x="0" data-y="1252" data-w="390" data-h="78"><rect x="0" y="1252" width="390" height="78" rx="0" fill="#FFFEFA" stroke="none" stroke-width="1"/><path d="M0 1252L390 1252" stroke="#E9DCC7" fill="none" stroke-dasharray=""/><g transform="translate(38.75 1264) scale(0.8333333333333334)" fill="none" stroke="#7B6B5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></g><text x="48.75" y="1302" font-size="11" font-weight="400" fill="#7B6B5A" text-anchor="middle">概览</text><g transform="translate(136.25 1264) scale(0.8333333333333334)" fill="none" stroke="#7B6B5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3zM12 6v16"/></g><text x="146.25" y="1302" font-size="11" font-weight="400" fill="#7B6B5A" text-anchor="middle">记录</text><g transform="translate(233.75 1264) scale(0.8333333333333334)" fill="none" stroke="#7B6B5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3zM3 16l5-5 5 5 3-3 5 5M17 7h.01"/></g><text x="243.75" y="1302" font-size="11" font-weight="400" fill="#7B6B5A" text-anchor="middle">素材</text><rect x="313.25" y="1259" width="56" height="48" rx="16" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(331.25 1264) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 2h6l1 4 4 1 2 5-3 3 1 4-5 3-3-3-4 1-3-5 3-3-1-4z"/></g><text x="341.25" y="1302" font-size="11" font-weight="700" fill="#7B6B5A" text-anchor="middle">设置</text><rect x="145" y="1319" width="100" height="4" rx="2" fill="#544235" stroke="none" stroke-width="1"/></g></svg>