<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1330" viewBox="0 0 390 1330"><title>记录编辑与版本历史</title><desc>MyLife 乌萨奇主题视觉提案。全部内容为示例。阶段 A。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="390" height="1330" fill="#FFF9ED"/><g data-ui="手机顶部 · 编辑家庭记录" data-x="0" data-y="0" data-w="390" data-h="87"><text x="22" y="17" font-size="12" font-weight="600" fill="#544235" text-anchor="start">9:41</text><path d="M320 14v-3m5 3V8m5 6V5" stroke="#544235" stroke-width="2.5"/><rect x="344" y="7" width="23" height="11" rx="3" fill="none" stroke="#544235" stroke-width="1.3"/><rect x="347" y="10" width="16" height="5" rx="1" fill="#544235" stroke="none" stroke-width="1"/><rect x="0" y="24" width="390" height="62" rx="0" fill="#FFF9ED" stroke="none" stroke-width="1"/><g transform="translate(20 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l-8 8 8 8"/></g><text x="55" y="61" font-size="18" font-weight="700" fill="#544235" text-anchor="start">编辑家庭记录</text><g transform="translate(347 45) scale(0.9166666666666666)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h.01M12 12h.01M20 12h.01"/></g><path d="M20 86L370 86" stroke="#E9DCC7" fill="none" stroke-dasharray=""/></g><g data-ui="标签 · 内容编辑" data-x="20" data-y="111" data-w="72" data-h="28"><rect x="20" y="111" width="72" height="28" rx="14" fill="#F6CE55" stroke="none" stroke-width="1"/><text x="32" y="128" font-size="12" font-weight="500" fill="#544235" text-anchor="start">内容编辑</text></g><g data-ui="标签 · 近期版本" data-x="132" data-y="111" data-w="72" data-h="28"><rect x="132" y="111" width="72" height="28" rx="14" fill="#FFFEFA" stroke="none" stroke-width="1"/><text x="144" y="128" font-size="12" font-weight="500" fill="#544235" text-anchor="start">近期版本</text></g><text x="20" y="179" font-size="13" font-weight="600" fill="#7B6B5A" text-anchor="start">标题</text><rect x="20" y="191" width="350" height="50" rx="14" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><text x="36" y="220" font-size="15" font-weight="400" fill="#544235" text-anchor="start">把秋天画进小房子</text><text x="20" y="290" font-size="14" font-weight="650" fill="#544235" text-anchor="start">正文</text><rect x="20" y="306" width="350" height="168" rx="20" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><text x="39" y="340" font-size="16" font-weight="400" fill="#544235" text-anchor="start">今天的阳光很暖，</text><text x="39" y="370.4" font-size="16" font-weight="400" fill="#544235" text-anchor="start">我想把路边的秋天画下来。</text><text x="39" y="400.8" font-size="16" font-weight="400" fill="#544235" text-anchor="start">先画远处的山，再加上小房子……</text><g data-ui="列表项 · 仅自己和家长可见" data-x="20" data-y="498" data-w="350" data-h="82"><rect x="20" y="498" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="515" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 528) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6a6 6 0 0 1 12 0v4M4 10h16v12H4zM12 15v3"/></g><text x="96" y="529" font-size="16" font-weight="600" fill="#544235" text-anchor="start">仅自己和家长可见</text><text x="96" y="553" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">选择公开并保存后，游客也可以阅读。</text><text x="353" y="536" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">修改</text></g><text x="20" y="644" font-size="21" font-weight="700" fill="#544235" text-anchor="start">最初的表达，仍然在这里。</text><rect x="20" y="670" width="350" height="149" rx="22" fill="#FFF0BF" stroke="none" stroke-width="1"/><text x="42" y="705" font-size="13" font-weight="650" fill="#544235" text-anchor="start">首次原文</text><text x="42" y="745" font-size="15" font-weight="400" fill="#7B6B5A" text-anchor="start">今天阳光很好，我画了一个</text><text x="42" y="773.5" font-size="15" font-weight="400" fill="#7B6B5A" text-anchor="start">秋天的小房子。画完特别开心。</text><text x="20" y="874" font-size="20" font-weight="700" fill="#544235" text-anchor="start">近期版本</text><g data-ui="列表项 · 版本 3 · 家长 1" data-x="20" data-y="897" data-w="350" data-h="82"><rect x="20" y="897" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="914" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 927) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v7l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"/></g><text x="96" y="928" font-size="16" font-weight="600" fill="#544235" text-anchor="start">版本 3 · 家长 1</text><text x="96" y="952" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">2026.10.25  16:20</text><text x="353" y="935" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">查看</text></g><g data-ui="列表项 · 版本 2 · 小小的我" data-x="20" data-y="995" data-w="350" data-h="82"><rect x="20" y="995" width="350" height="82" rx="18" fill="#FFFEFA" stroke="#E9DCC7" stroke-width="1"/><rect x="34" y="1012" width="46" height="46" rx="14" fill="#FFF0BF" stroke="none" stroke-width="1"/><g transform="translate(47 1025) scale(0.8333333333333334)" fill="none" stroke="#544235" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v7l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"/></g><text x="96" y="1026" font-size="16" font-weight="600" fill="#544235" text-anchor="start">版本 2 · 小小的我</text><text x="96" y="1050" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">2026.10.24  18:32</text><text x="353" y="1033" font-size="12" font-weight="500" fill="#7B6B5A" text-anchor="end">查看</text></g><text x="20" y="1133" font-size="12" font-weight="400" fill="#7B6B5A" text-anchor="start">当前保留最多 100 个近期版本。</text><rect x="0" y=