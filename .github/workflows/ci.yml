name: Verify MyLife
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate --workspace @mylife/cms
        env:
          NODE_ENV: production
      - run: npm run build
